<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">AI短剧：从剧本到完整作品的制作链路</title>
  <desc id="desc">本站原创学习图解。制作链路包括剧本开发、资产分镜、AI制作、内容译制及海外发行。学习观察关注版本、质量与完整成本。</desc>
  <defs>
    <style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#263e35}.small{font-size:18px;fill:#53675b}.line{fill:none;stroke:#648672;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style>
    <pattern id="perforation" width="28" height="20" patternUnits="userSpaceOnUse"><rect x="8" y="5" width="12" height="10" rx="2" fill="#f6f5ee"/></pattern>
  </defs>
  <rect width="960" height="600" rx="12" fill="#f1efe6"/>
